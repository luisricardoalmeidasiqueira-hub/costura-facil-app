<style>
:root{--p:#b5165b;--v:#76239b;--pk:#fde7f0;--ink:#29232d;--m:#716875;--l:#eadce5;--ok:#2e9b57}

details{background:#fff;border:1px solid var(--l);border-radius:16px;padding:12px 14px;margin:10px 0}summary{font-weight:900;font-size:16px;cursor:pointer;color:var(--p)}details[open] summary{margin-bottom:6px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#29232d;color:#fff;border-radius:12px;padding:11px 15px;display:none;z-index:9}
.ft{text-align:center;padding:16px;color:#817680;font-size:12px}
@media(max-width:390px){.grid{grid-template-columns:1fr}}

avental:['🧑‍🍳','Avental simples','Defina largura e comprimento;Desenhe o molde com centro e laterais;Some a margem de costura;Confira o fio e corte;Passe as bordas e faça as bainhas;Faça as tiras de cintura e pescoço;Prenda as tiras simétricas e reforce;Revise, corte fios e passe'],
bolsa:['👜','Bolsa tote','Escolha o tamanho;Corte 2 retângulos iguais;Corte e costure 2 alças iguais;Costure laterais e fundo, direito com direito;Faça a bainha da abertura;Meça e prenda as alças pelo centro;Reforce as alças e revise'],
fronha:['🛏️','Fronha simples','Meça o travesseiro e some a folga;Planeje o envelope;Corte o retângulo;Faça as bainhas aparentes;Dobre em envelope e costure as laterais;Vire, passe e teste'],
blusa:['👚','Blusa básica','Separe as medidas (busto, ombro, cava, comprimento);Identifique frente e costas;Confira fio, dobra e piques;Acrescente margens se precisar;Faça uma prova antes do tecido final']};
Object.assign(G,{
medir:['📏','Como tirar medidas','Vista roupa fina e fique em pé, sem forçar a postura;Busto: passe a fita na parte mais cheia do busto, nivelada nas costas;Cintura: meça na parte mais fina do tronco, sem apertar;Quadril: meça na parte mais larga, uns 20 cm abaixo da cintura;Ombro: da base do pescoço até a ponta do ombro;Contorno do braço: na parte mais grossa do braço;Comprimento do braço: do ombro até o pulso, com o braço um pouco dobrado;Altura: sem sapato, encostada na parede;Anote tudo em Minhas medidas e repita cada medida duas vezes'],
ler:['🔍','Como ler um molde','Ache o nome e o tamanho de cada peça;Veja quantas vezes cortar e em qual tecido;Ache a seta do fio, ela fica paralela à ourela;Se estiver escrito "na dobra", encoste essa borda na dobra do tecido;Copie os piques (marcas) no tecido;Veja se a margem de costura já está inclusa, se não, acrescente 1 cm;Escreva em cada peça se é frente ou costas'],
xuxinha:['🎀','Xuxinha de cabelo','Corte uma tira de tecido de 50 x 12 cm;Dobre a tira ao meio no comprimento, direito com direito;Costure o lado comprido com 1 cm de margem;Vire do direito, passando pelas pontas abertas;Passe um elástico de 20 cm por dentro com um alfinete de segurança;Dê um nó firme nas pontas do elástico;Dobre 1 cm das pontas do tecido para dentro e costure rente à borda'],
necessaire:['👝','Necessaire com zíper','Corte 2 retângulos de tecido de 22 x 15 cm;Prenda o zíper na borda de cima de um retângulo, direito com direito, e costure;Faça o mesmo com o outro retângulo, no outro lado do zíper;Abra o zíper pela metade;Junte as peças direito com direito e costure os lados e o fundo;Corte as pontas dos cantos e vire pelo zíper;Passe o ferro e corte as sobras de linha'],
almofada:['🛋️','Capa de almofada (envelope)','Para almofada de 40 x 40 cm: corte 1 retângulo de 42 x 42 cm (frente);Corte 2 retângulos de 42 x 28 cm (costas);Faça uma bainha dupla de 1 cm no lado de 42 cm de cada retângulo das costas;Ponha a frente com o direito para cima;Coloque as costas por cima, direito para baixo, com as bainhas se cruzando no meio;Prenda e costure os 4 lados com 1 cm de margem;Corte as pontas dos cantos, vire e passe;Coloque a almofada'],

const NP=['ler','medir'];
const PB=`Linha embolando embaixo do tecido|Pare e levante o calcador;Tire o tecido e corte os nós de linha;Passe a linha de cima de novo, com o calcador levantado;Recoloque a bobina seguindo o manual;Recomece devagar, segurando as pontas das linhas
Linha de cima arrebentando|Passe a linha de novo do começo;Troque a agulha se estiver torta ou gasta;Veja se a linha não tem nós;Afrouxe um pouco a tensão e teste num retalho
Pontos falhando ou pulando|Troque a agulha, ela pode estar torta ou cega;Confira se é a agulha certa para o tecido;Coloque a agulha com o lado certo e até o fundo;Passe a linha de novo e teste
Ponto frouxo ou com laçadas|Levante o calcador e passe a linha de cima de novo;Veja se a linha entrou nos discos de tensão;Ajuste a tensão aos poucos, meio número por vez;Teste num retalho
Tecido franzindo sozinho|Diminua a tensão da linha;Aumente o comprimento do ponto;Use agulha fina em tecido leve;Costure sem puxar nem empurrar o tecido
Agulha quebrando|Desligue a máquina;Não puxe o tecido nem costure sobre alfinetes;Use agulha mais grossa se o tecido for pesado;Confira se a agulha está bem presa
Tecido não anda|Baixe o calcador;Desligue a máquina e limpe a poeira dos dentes de transporte;Aumente o comprimento do ponto;Não puxe o tecido, deixe a máquina levar
Costura torta|Marque a linha no tecido;Use a guia da chapa como referência;Olhe para a linha e não para a agulha;Costure mais devagar`.trim().split('\n').map(x=>{const[a,b]=x.split('|');return{t:a,s:b.split(';')}});
const KIT='Máquina de costura com o manual;Linhas de poliéster em algumas cores;Agulhas para tecido leve, médio e pesado;Tesoura só para tecido;Fita métrica;Régua de 30 ou 50 cm;Alfinetes com cabeça;Giz ou caneta própria para tecido;Descosedor;Ferro de passar e tábua'.split(';');
const Q=[['Antes de costurar a peça final, qual é uma boa prática?',['Cortar direto no tecido caro','Testar em um retalho','Ignorar o fio'],1,'O retalho mostra problemas antes de gastar o tecido final.'],
['O que a linha de fio indica?',['A direção estrutural do tecido','A cor da linha','O tamanho do botão'],0,'O fio orienta como posicionar o molde no tecido.'],
['O que é margem de costura?',['Uma decoração','Espaço entre a linha de costura e a borda de corte','Uma regulagem'],1,'É o espaço além da linha onde as peças serão unidas.'],
['Ao trocar a agulha, o que é seguro fazer?',['Manter a máquina ligada','Desligar conforme o manual','Aumentar a velocidade'],1,'Desligue sempre que mexer perto de partes móveis.'],
['Para que servem os piques?',['Alinhar as peças','Escolher a cor','Regular a luz'],0,'São marcas de referência para a montagem.'],
['A costura saiu da direção. O que fazer?',['Acelerar','Puxar o tecido','Diminuir a velocidade e corrigir devagar'],2,'Pequenas correções em baixa velocidade dão mais controle.'],
['Por que passar o tecido durante a montagem?',['Só para enfeitar','Assenta costuras e melhora a precisão','Para escolher a linha'],1,'A passadoria faz parte da montagem.'],
['Por que fazer uma peça de prova?',['Gastar mais tecido','Conferir medidas e caimento','Evitar medir'],1,'Permite ajustar antes do tecido final.']];
const GL=`Agulha|Peça de metal que atravessa o tecido levando a linha de cima. Cada tecido pede uma agulha diferente.|Veja se o tecido é leve, médio, pesado ou elástico;Escolha a agulha indicada para esse tipo de tecido;Desligue a máquina e troque a agulha seguindo o manual;Teste num retalho e troque a agulha se ela entortar ou o ponto falhar
Avesso|É o lado de dentro da peça, o que não fica à mostra.|Passe a mão no tecido: o direito costuma ser mais liso e colorido;Marque o avesso com giz ou um alfinete;Junte sempre direito com direito antes de costurar;Confira os lados antes de cortar e de costurar
Bainha|Acabamento feito dobrando a borda do tecido para dentro e costurando.|Marque a largura da dobra com régua;Dobre a borda e passe com o ferro;Prenda com alfinetes;Costure a distância constante da borda e confira
Bobina|Pequeno carretel que guarda a linha de baixo da máquina.|Use a bobina indicada para o seu modelo;Encha a linha de forma uniforme, seguindo o manual;Coloque no lugar seguindo o desenho da máquina;Teste o ponto num retalho
Calcador|Peça que segura o tecido para baixo enquanto ele anda na máquina.|Levante o calcador para posicionar o tecido;Alinhe a borda do tecido com a guia do calcador;Baixe o calcador antes de apertar o pedal;Levante de novo para tirar ou girar o tecido
Cava|Abertura do molde por onde entra o braço.|Localize a curva da cava no molde da frente e das costas;Meça a curva com a fita de lado;Confira se frente e costas têm cavas parecidas;Faça a prova para ver se o braço tem folga
Decote|Abertura ao redor do pescoço.|Marque a profundidade do decote no molde;Corte a curva devagar;Acabe com viés ou uma faixa;Prove para ver se passa pela cabeça
Direito|Lado do tecido que fica à mostra na peça pronta.|Escolha qual lado será o direito (o mais bonito);Cole um pedacinho de fita no avesso para lembrar;Encoste direito com direito ao unir peças;Confira antes de costurar
Dobra|Linha formada quando o tecido é dobrado ao meio.|Dobre o tecido ao meio, alinhando as pontas;Passe a mão para desamassar;Encoste a borda "na dobra" do molde nessa linha;Corte sem abrir o tecido
Entretela|Material colado ou costurado no avesso para dar estrutura ao tecido.|Corte a entretela do formato da peça;Ponha o lado colante contra o avesso do tecido;Passe o ferro apertando por alguns segundos, sem arrastar;Espere esfriar antes de costurar
Esquadrejar|Deixar os cantos do tecido em ângulo reto, bem quadrados.|Dobre o tecido pelo fio e alinhe as ourelas;Use uma régua com esquadro no canto;Marque a linha reta;Corte na linha para os cantos ficarem retos
Fio do tecido|Direção dos fios do tecido. Ela influencia o caimento da peça.|Ache a ourela (borda que não desfia);Veja que o fio corre paralelo a ela;Alinhe a seta do molde paralela à ourela;Meça a seta nos dois lados para confirmar
Franzido|Tecido reunido para ocupar menos espaço e criar volume.|Faça duas linhas de ponto longo na borda;Deixe pontas de linha nos dois lados;Puxe as linhas de baixo aos poucos;Distribua o volume por igual e prenda antes de costurar
Linha de costura|Linha onde as peças realmente serão unidas.|Marque a linha de costura no tecido;Encoste as bordas e prenda com alfinetes;Costure exatamente sobre a linha;Não confunda com a borda de corte
Margem de costura|Espaço entre a linha de costura e a borda de corte.|Veja se o molde já inclui a margem;Se não incluir, acrescente 1 cm em volta;Corte já com a margem;Costure mantendo a mesma largura de margem
Molde|Desenho em papel de cada parte da peça. Serve de guia de corte.|Confira nome, tamanho e quantidade de cada parte;Marque fio, dobra e piques;Prenda o molde no tecido com alfinetes;Corte contornando o molde e guarde-o depois

Pence|Dobra costurada em ponta que modela o tecido ao corpo.|Marque as pontas da pence com giz;Dobre o tecido ao meio, juntando as marcas;Costure da parte larga até a ponta;Passe a pence para um lado

Retrocesso|Costura para trás que reforça o começo e o fim.|Costure 2 ou 3 pontos;Aperte a alavanca de retrocesso e volte os pontos;Solte e siga costurando;No fim, repita o retrocesso
Viés|Direção diagonal do tecido, ou tira cortada nessa direção para acabamentos.|Corte a tira em diagonal, a 45 graus da ourela;Passe a tira dobrada ao meio;Envolva a borda com ela;Costure devagar sem esticar
Zíper|Fecho com dentes e cursor que abre e fecha a peça.|Marque onde ele ficará;Prenda com alfinetes numa amostra em retalho;Use o calcador de zíper;Costure devagar e teste o cursor`.trim().split('\n').map(x=>{const[a,b,c]=x.split('|');return{t:a,d:b,s:c.split(';')}});
const M=[['busto','Busto'],['cintura','Cintura'],['quadril','Quadril'],['ombro','Ombro'],['braco','Contorno do braço'],['compbraco','Comprimento do braço'],['altura','Altura'],['comp','Comprimento desejado da saia/peça']];
const MENU=[['cursos','📚','Cursos','Aulas passo a passo'],['moldes','📐','Moldes','Guias rápidos'],['medidas','📏','Minhas medidas','Salve e consulte'],['tecnicas','✂️','Técnicas','Consulta rápida'],['projetos','👗','Projetos','Faça junto com o app'],['glossario','📖','Glossário','Termos explicados'],['pratica','🎯','Prática','Exercícios e revisão'],['videos','🎥','Vídeos','Demonstrações'],['problemas','🛠️','Resolver problemas','Se a costura der errado'],['kit','🧰','Kit inicial','O que ter para começar'],['sobre','ℹ️','Sobre','Como usar o app'],['lixeira','🗑️','Lixeira','Dados salvos no aparelho']];
const B=(id,a,t)=>`<button class="back" onclick="go('${id}','${a||''}')">← ${t}</button>`;
const SL=a=>'<div class="steps">'+a.map(x=>`<div class="step">${x}</div>`).join('')+'</div>';
const dn=(k,i)=>L.getItem('done_'+k+'_'+i);
function prog(){let d=0,t=0;for(const k in LS)LS[k].forEach((_,i)=>{t++;if(dn(k,i))d++});return[d,t]}
const tlH=q=>{q=q.toLowerCase();return Object.values(LS).flat().filter(l=>(l.t+l.s.join(' ')).toLowerCase().includes(q)).map(l=>`<div class="box" style="margin:10px 0"><b>${l.t}</b><p class="desc" style="margin:6px 0 0">${l.s.join(' → ')}</p></div>`).join('')};
const glH=q=>{q=q.toLowerCase();const r=GL.filter(x=>(x.t+' '+x.d).toLowerCase().includes(q));return r.length?r.map(x=>`<div class="box" style="margin:14px 0"><h3 style="margin:0 0 6px;color:var(--p)">📖 ${x.t}</h3><p class="desc" style="margin:0 0 10px"><b>O que é:</b> ${x.d}</p><b>👣 Passo a passo</b>${SL(x.s)}</div>`).join(''):'<p class="desc">Nenhum termo encontrado.</p>'};
const R={
problemas(){return`${B('home','','Início')}<h2>🛠️ Resolver problemas</h2><p class="desc">Achou o seu problema? Siga os passos na ordem.</p>`+PB.map(x=>`<div class="box" style="margin:14px 0"><h3 style="margin:0 0 6px;color:var(--p)">⚠️ ${x.t}</h3>${SL(x.s)}</div>`).join('')},
kit(){return`${B('home','','Início')}<h2>🧰 Kit inicial</h2><p class="desc">O básico para começar a costurar.</p>`+SL(KIT)+`<div class="tip">💡 Comece só com o essencial. O resto você compra conforme os projetos.</div>`},
menu(){return`<button class="back" onclick="go(last[0],last[1])">← Voltar</button><h2>☰ Menu</h2>`+[['home','🏠','Início','Tela inicial'],...MENU].map(m=>`<button class="item" style="width:100%;text-align:left" onclick="go('${m[0]}')"><div class="num">${m[1]}</div><div><b>${m[2]}</b><br><small>${m[3]}</small></div></button>`).join('')+`<button class="out" onclick="shareApp()">📤 Compartilhar</button><button class="out" onclick="updateApp()">🔄 Atualizar app</button><button class="pri" onclick="go(last[0],last[1])">← VOLTAR</button>`},
home(){const[d,t]=prog();return`<div class="box"><h2 style="margin:0 0 6px">Bem-vindo(a)! 💕</h2><p class="desc">Aprenda com calma, um passo de cada vez. Pratique em retalho e só avance quando se sentir seguro.</p><button class="pri" onclick="go('cursos')">▶ COMEÇAR A APRENDER</button></div><div class="grid">${MENU.map(m=>`<button class="card" onclick="go('${m[0]}')"><span class="ico">${m[1]}</span><b>${m[2]}</b><small>${m[3]}</small></button>`).join('')}</div><div class="box" style="margin-top:12px"><b>📈 Seu progresso</b><div class="bar"><i style="width:${d/t*100}%"></i></div><small class="desc">${d} de ${t} aulas concluídas</small></div><div class="grid"><button class="out" onclick="shareApp()">📤 Compartilhar</button><button class="out" onclick="updateApp()">🔄 Atualizar app</button></div>`},
cursos(){return`${B('home','','Início')}<h2>📚 Curso completo</h2><p class="desc">Toque em um nível e siga os passos.</p>`+Object.keys(LS).map((k,n)=>{const d=LS[k].filter((_,i)=>dn(k,i)).length;return`<div class="item"><div class="num">${n+1}</div><div><b>${T[k]}</b><br><small>${d} de ${LS[k].length} aulas concluídas</small></div><button class="mini" onclick="go('nivel','${k}')">Ver</button></div>`}).join('')},
nivel(k){return`${B('cursos','','Cursos')}<h2>${T[k]}</h2>`+LS[k].map((l,i)=>`<div class="item ${dn(k,i)?'dn':''}"><div class="num">${i+1}</div><div><b>${l.t}</b>${dn(k,i)?'<br><small>✓ Concluída</small>':''}</div><button class="mini" onclick="go('aula','${k}_${i}')">${dn(k,i)?'Rever':'Abrir'}</button></div>`).join('')},
aula(a){const[k,i]=a.split('_'),l=LS[k][+i];L.setItem('last',a);return`${B('nivel',k,'Voltar')}<h2>${l.t}</h2><p class="desc">${T[k]} • Aula ${+i+1}</p>${SL(l.s)}<div class="tip">💡 Faça primeiro em um retalho, sem pressa.</div><button class="pri" onclick="fin('${a}')">✓ MARCAR AULA COMO CONCLUÍDA</button><div class="nav2"><button onclick="nx('${a}',-1)">← Anterior</button><button onclick="nx('${a}',1)">Próxima →</button></div>`},
moldes(){return`${B('home','','Início')}<h2>📐 Moldes</h2><p class="desc">Guias rápidos. Sempre faça uma prova antes do tecido final.</p>`+['medir','ler','saia','avental','bolsa','blusa','saiael'].map(k=>`<div class="item"><div class="num">${G[k][0]}</div><div><b>${G[k][1]}</b></div><button class="mini" onclick="go('guia','${k}')">Abrir</button></div>`).join('')},
projetos(){return`${B('home','','Início')}<h2>👗 Projetos</h2><p class="desc">Escolha um e siga os passos.</p>`+['avental','bolsa','fronha','xuxinha','necessaire','almofada','saiael','saia'].map(k=>`<div class="item ${L.getItem('project_'+k)?'dn':''}"><div class="num">${G[k][0]}</div><div><b>${G[k][1]}</b>${L.getItem('project_'+k)?'<br><small>✓ Concluído</small>':''}</div><button class="mini" onclick="go('guia','${k}')">Abrir</button></div>`).join('')},
guia(k){const g=G[k],c=k==='saia'?`<div class="box"><label>Cintura (cm)</label><input id="sc" type="number" inputmode="decimal"><label>Quadril (cm)</label><input id="sq" type="number" inputmode="decimal"><label>Comprimento (cm)</label><input id="sl" type="number" inputmode="decimal"><button class="pri" onclick="calcSaia()">📐 CALCULAR</button><div id="sr"></div></div>`:'';return`${B(gfrom,'','Voltar')}<h2>${g[0]} ${g[1]}</h2>${c}${SL(g[2].split(';'))}${NP.includes(k)?'':`<div class="tip">💡 Faça a primeira versão em tecido de teste.</div><button class="pri" onclick="L.setItem('project_${k}','1');toast('Marcado como concluído ✓')">✓ MARCAR COMO CONCLUÍDO</button>`}`},
medidas(){return`${B('home','','Início')}<h2>📏 Minhas medidas</h2><p class="desc">Meça sem apertar a fita e repita duas vezes.</p><div class="box">${M.map(m=>`<label>${m[1]} (cm)</label><input id="m_${m[0]}" type="number" step="0.1" inputmode="decimal" value="${L.getItem('med_'+m[0])||''}">`).join('')}<button class="pri" onclick="M.forEach(m=>L.setItem('med_'+m[0],$('m_'+m[0]).value));toast('Medidas salvas ✓')">💾 SALVAR MEDIDAS</button></div>`},
tecnicas(){return`${B('home','','Início')}<h2>✂️ Técnicas</h2><input placeholder="🔎 Buscar técnica..." oninput="$('tl').innerHTML=tlH(this.value)"><div id="tl">${tlH('')}</div>`},
glossario(){return`${B('home','','Início')}<h2>📖 Glossário</h2><p class="desc">Cada termo mostra o que é e o passo a passo. Use a busca para achar mais rápido.</p><input placeholder="🔎 Buscar termo..." oninput="$('tl').innerHTML=glH(this.value)"><div id="tl">${glH('')}</div>`},
pratica(){return`${B('home','','Início')}<h2>🎯 Prática</h2>`+Q.map((q,i)=>`<div class="box" style="margin:10px 0"><b>${i+1}. ${q[0]}</b>${q[1].map((o,j)=>`<button class="op" onclick="ans(${i},${j},this)">${o}</button>`).join('')}<div class="desc" id="r${i}"></div></div>`).join('')+`<div class="tip">🏆 Acertos registrados: <b>${L.getItem('quizScore')||0}</b></div>`},
videos(){const v=[['🧵','Primeiros passos','costura para iniciantes máquina de costura passagem de linha bobina'],['📏','Como tirar medidas','como tirar medidas para costura busto cintura quadril'],['📐','Entendendo moldes','como interpretar molde de costura fio do tecido margem piques'],['✂️','Costura reta e acabamento','costura reta bainha acabamento iniciantes']];return`${B('home','','Início')}<h2>🎥 Vídeos de apoio</h2><p class="desc">Abre uma busca no YouTube. O app não hospeda vídeos de terceiros.</p>`+v.map(x=>`<div class="item"><div class="num">${x[0]}</div><div><b>${x[1]}</b></div><button class="mini" onclick="window.open('https://www.youtube.com/results?search_query='+encodeURIComponent('${x[2]} português'),'_blank','noopener')">▶️ Buscar</button></div>`).join('')},
lixeira(){const n=p=>Object.keys(L).filter(k=>k.startsWith(p)).length;return`${B('home','','Início')}<h2>🗑️ Lixeira e dados salvos</h2><div class="box" style="line-height:1.9">📏 Medidas salvas: <b>${n('med_')}</b><br>📚 Aulas concluídas: <b>${n('done_')}</b><br>👗 Projetos concluídos: <b>${n('project_')}</b></div><div class="tip r">⚠️ Apaga só os dados deste aparelho, não o aplicativo.</div><button class="pri" style="background:#8f234d" onclick="if(confirm('Apagar todos os dados salvos neste aparelho?')){L.clear();toast('Dados apagados.');go('home')}">🗑️ APAGAR TODOS OS DADOS</button>`},
sobre(){return`${B('home','','Início')}<h2>ℹ️ Sobre o Costura Fácil</h2><div class="box desc"><p><b>Objetivo:</b> ensinar costura em passos simples: máquina, medidas, moldes, corte e montagem.</p><p><b>Como estudar:</b> leia os passos, pratique em retalho, confira e repita quando precisar.</p><p><b>Segurança:</b> para agulha, bobina e limpeza, siga o manual da sua máquina.</p><p><b>Privacidade:</b> medidas e progresso ficam salvos só neste aparelho.</p></div>`}};
let last=['home',''],cur='home',gfrom='moldes';
function go(id,a){if(id==='guia'&&(cur==='projetos'||cur==='moldes'))gfrom=cur;if(id!=='menu')last=[id,a];cur=id;document.querySelector('.hb').textContent=id==='menu'?'✕':'☰';$('v').innerHTML=R[id](a);scrollTo(0,0);const f={home:'home',cursos:'cursos',nivel:'cursos',aula:'cursos',moldes:'moldes',guia:'moldes'}[id];document.querySelectorAll('footer button').forEach(b=>b.classList.toggle('on',b.dataset.g===f))}
function fin(a){L.setItem('done_'+a,'1');toast('Aula concluída ✓')}
function nx(a,d){let[k,i]=a.split('_');i=+i+d;const o=['n1','n2','n3','n4'];let p=o.indexOf(k);if(i<0){if(--p<0)return toast('Esta é a primeira aula.');k=o[p];i=LS[k].length-1}else if(i>=LS[k].length){if(++p>3)return toast('Você chegou ao fim do curso ✓');k=o[p];i=0}go('aula',k+'_'+i)}
function calcSaia(){const c=+$('sc').value,q=+$('sq').value,l=+$('sl').value;if(!c||!q||!l)return toast('Preencha cintura, quadril e comprimento.');$('sr').innerHTML=`<div class="tip"><b>Quadril ÷ 4 + 1:</b> ${(q/4+1).toFixed(1)} cm<br><b>Cintura ÷ 4 + 1:</b> ${(c/4+1).toFixed(1)} cm<br><b>Comprimento:</b> ${l} cm</div><div class="tip r">⚠️ Cálculo educativo simples. Faça uma prova antes do tecido final.</div>`}
function ans(i,j,el){const q=Q[i];el.parentNode.querySelectorAll('.op').forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('c')});if(j===q[2]){L.setItem('quizScore',+(L.getItem('quizScore')||0)+1);$('r'+i).textContent='✓ Correto! '+q[3]}else{el.classList.add('w');$('r'+i).textContent='A resposta certa está em verde. '+q[3]}}
function shareApp(){const url=location.origin+location.pathname;if(navigator.share)navigator.share({title:'Costura Fácil',text:'Aprenda costura com o aplicativo Costura Fácil.',url}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Link do app copiado ✓')).catch(()=>toast('Copie o endereço da página para compartilhar.'));else toast('Copie o endereço da página para compartilhar.')}
async function updateApp(){toast('Atualizando o app...');try{if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}setTimeout(()=>location.replace(location.pathname+'?v='+Date.now()),600)}
go('home');
</script>
</body>
</html>
